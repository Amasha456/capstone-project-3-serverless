<svg width="680" height="686" viewBox="0 0 680 686" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Serverless task management architecture</title>
<desc>A client sends requests through API Gateway to createTask and listTasks Lambda functions, which read/write DynamoDB. createTask also publishes to an SQS queue that triggers processNotification, which retries on failure before landing in a Dead Letter Queue. A separate EventBridge daily schedule triggers exportReport, which reads DynamoDB and writes a CSV to S3.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="686" fill="#ffffff"/>

<g>
<rect x="270" y="40" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Client</text>
</g>
<line x1="340" y1="84" x2="340" y2="114" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="210" y="114" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">API Gateway</text>
<text x="340" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">REST API + API key</text>
</g>

<path d="M340 170 L340 195 L155 195 L155 220" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 170 L340 195 L525 195 L525 220" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="220" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="155" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">createTask</text>
<text x="155" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">POST /tasks</text>
</g>
<g>
<rect x="430" y="220" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="525" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">listTasks</text>
<text x="525" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">GET /tasks</text>
</g>

<line x1="155" y1="276" x2="155" y2="310" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M155 276 L155 295 L510 295 L510 310" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M525 276 L525 300 L220 300 L220 310" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="310" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="165" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">DynamoDB</text>
<text x="165" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Tasks table</text>
</g>
<g>
<rect x="395" y="310" width="230" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="510" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">SQS queue</text>
<text x="510" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">task-notifications</text>
</g>

<line x1="510" y1="366" x2="510" y2="400" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="395" y="400" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="510" y="418" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">processNotification</text>
<text x="510" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Retries 3x on failure</text>
</g>

<line x1="510" y1="456" x2="510" y2="490" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="395" y="490" width="230" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="510" y="512" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Dead letter queue</text>
</g>

<g>
<rect x="40" y="590" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="130" y="608" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">EventBridge</text>
<text x="130" y="626" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">Daily schedule</text>
</g>
<line x1="220" y1="618" x2="240" y2="618" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="240" y="590" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="608" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">exportReport</text>
<text x="340" y="626" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Reads all tasks</text>
</g>
<line x1="440" y1="618" x2="460" y2="618" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="460" y="590" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="608" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">S3 bucket</text>
<text x="550" y="626" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">reports/*.csv</text>
</g>
</svg>
